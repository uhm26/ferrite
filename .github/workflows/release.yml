# Release one tool: push a tag `<tool>-v<version>` (e.g. clipboard-v0.2.0). This tests it,
# builds it in a clean Arch Linux container (ferrite supports Arch only) and publishes
# `<tool>-x86_64-linux.tar.gz` + `.sha256` as a GitHub release that install.sh downloads.
name: release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Arch packages
        # Build deps of every tool (fontconfig/freetype/xkbcommon: frame; librsvg/cairo/glib/
        # libwebp: pix; mpv/mesa/libglvnd: video; libarchive: files' archive test).
        run: |
          pacman -Syu --noconfirm --needed base-devel rust git github-cli \
            fontconfig freetype2 libxkbcommon librsvg cairo glib2 libwebp \
            mpv mesa libglvnd libarchive adwaita-fonts dbus

      - uses: actions/checkout@v5

      - name: Read the tag
        id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          tool="${tag%-v*}"
          version="${tag##*-v}"
          case "$tool" in
            term|files|image|video|screenshot|wallpaper|clipboard|auth) ;;
            *) echo "no release build for '$tool'" >&2; exit 1 ;;
          esac
          grep -q "^version = \"$version\"$" "$tool/Cargo.toml" \
            || { echo "$tool/Cargo.toml is not at version $version" >&2; exit 1; }
          {
            echo "tool=$tool"
            echo "version=$version"
            echo "asset=$tool-x86_64-linux"
          } >> "$GITHUB_OUTPUT"

      - name: Test
        # Tests open the Adwaita fonts and talk to real D-Bus buses (files).
        run: |
          mkdir -p /run/dbus && dbus-daemon --system --fork
          dbus-run-session -- cargo test -q --release -p "${{ steps.tag.outputs.tool }}"

      - name: Build
        run: cargo build --release -p "${{ steps.tag.outputs.tool }}"

      - name: Package
        env:
          TOOL: ${{ steps.tag.outputs.tool }}
          ASSET: ${{ steps.tag.outputs.asset }}
        run: |
          mkdir -p "dist/$ASSET"
          cp "target/release/$TOOL" "$TOOL/README.md" LICENSE-MIT LICENSE-APACHE "dist/$ASSET/"
          # Desktop entry + icon for the GUI tools (install.sh puts them in place).
          for f in "$TOOL/resources/$TOOL.desktop" "$TOOL/resources/$TOOL.svg"; do
            if [ -f "$f" ]; then cp "$f" "dist/$ASSET/"; fi
          done
          tar -C dist -czf "dist/$ASSET.tar.gz" "$ASSET"
          (cd dist && sha256sum "$ASSET.tar.gz" > "$ASSET.tar.gz.sha256")
          ls -l dist "dist/$ASSET"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.tag.outputs.asset }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" "dist/$ASSET.tar.gz" "dist/$ASSET.tar.gz.sha256" \
            --title "${{ steps.tag.outputs.tool }} ${{ steps.tag.outputs.version }}" \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/uhm26/ferrite/main/install.sh | sh -s -- ${{ steps.tag.outputs.tool }}\`"
