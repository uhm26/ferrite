# Install the newest release of every tool into a clean Arch Linux and a clean Fedora container,
# the way a user would: install.sh, then exactly the pacman/dnf line it prints, then start every tool.
# Run by hand (Actions → install-test → Run workflow) after releases.
name: install-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [archlinux:latest, fedora:latest]
    steps:
      - uses: actions/checkout@v5
      - name: Download the newest release of each tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          : > versions
          # One API call: a failed one (GitHub 504s) must stop the run, not leave a tag empty.
          tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq ".[].tagName")
          for t in term files image video screenshot wallpaper clipboard auth; do
            tag=$(echo "$tags" | grep "^$t-v" | head -n 1)
            [ -n "$tag" ] || { echo "no release of $t"; exit 1; }
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "mirror/$tag"
            echo "$t ${tag#"$t"-v}" >> versions
          done
          cat versions
      - name: Install and run in a clean ${{ matrix.image }} container
        run: |
          docker run --rm -v "$PWD:/ferrite" -w /ferrite ${{ matrix.image }} sh -euc '
            # A bare system: no fonts, no ferrite deps. install.sh must ask for all of it.
            if command -v dnf >/dev/null; then
              pkg() { dnf install -y -q "$@" >/dev/null; }; ffmpeg=ffmpeg-free
              pkg tar gzip  # in every Fedora desktop, maybe not in the slim container image
            else
              pacman -Sy --noconfirm >/dev/null
              pkg() { pacman -S --noconfirm --needed "$@" >/dev/null; }; ffmpeg=ffmpeg
            fi
            export FERRITE_MIRROR=/ferrite/mirror HOME=/root XDG_DATA_HOME=/root/.local/share
            hints=""
            while read -r t v; do
              out=$(sh install.sh --version "$v" "$t" 2>&1)
              echo "$out"
              line=$(echo "$out" | grep -o "sudo \(pacman -S --needed\|dnf install\).*" || true)
              line=${line#sudo pacman -S --needed}
              hints="$hints ${line#sudo dnf install}"
            done < versions
            echo "== installing what install.sh asked for:$hints"
            [ -z "${hints# }" ] || pkg $hints
            echo "== nothing may be missing now"
            for t in term files image video screenshot wallpaper clipboard auth; do
              if ldd "/root/.local/bin/$t" | grep "not found"; then echo "$t still misses libraries"; exit 1; fi
            done
            echo "== start every tool"
            b=/root/.local/bin
            "$b/term" --version
            pkg "$ffmpeg"  # demo files only, after the dependency check
            mkdir -p /tmp/demo/pics
            ffmpeg -loglevel error -f lavfi -i "mandelbrot=s=320x200" -frames:v 1 /tmp/demo/pics/a.png
            ffmpeg -loglevel error -f lavfi -i "testsrc2=s=320x240:r=10" -t 2 -pix_fmt yuv420p /tmp/demo/v.mp4
            "$b/image" --png /tmp/demo/image.png --size 320x200 /tmp/demo/pics/a.png
            "$b/files" --png /tmp/demo/files.png --size 640x400 /tmp/demo/pics
            "$b/video" --png /tmp/demo/video.png --size 320x240 /tmp/demo/v.mp4
            for f in image files video; do test -s "/tmp/demo/$f.png" || { echo "$f rendered nothing"; exit 1; }; done
            # Daemons and screenshot need a compositor: they must start and fail cleanly without one.
            export XDG_RUNTIME_DIR=/tmp/rt WAYLAND_DISPLAY=none; mkdir -p "$XDG_RUNTIME_DIR"
            for t in screenshot clipboard; do
              if "$b/$t" /tmp/x.png 2>err; then echo "$t ran without a compositor?"; exit 1; fi
              grep -q "wayland socket" err || { cat err; exit 1; }
            done
            "$b/wallpaper" 2>&1 | grep -q usage
            # auth needs a login session (logind) before anything else.
            if "$b/auth" 2>err; then echo "auth ran without a session?"; exit 1; fi
            grep -q "XDG_SESSION_ID" err || { cat err; exit 1; }
            echo "== all 8 tools installed and started"
          '
