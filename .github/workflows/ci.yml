# Checks on every push and pull request: lints + tests for the whole workspace in Arch Linux,
# and install.sh under dash (strict POSIX) with a fake release in Arch and in Fedora.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Arch packages
        run: |
          pacman -Syu --noconfirm --needed base-devel rust git \
            fontconfig freetype2 libxkbcommon librsvg cairo glib2 libwebp \
            mpv mesa libglvnd libarchive adwaita-fonts dbus
      - uses: actions/checkout@v5
      - name: Clippy
        run: cargo clippy -q --workspace --all-targets -- -D warnings
      - name: Test
        # Tests open the Adwaita fonts and talk to real D-Bus buses (files).
        run: |
          mkdir -p /run/dbus && dbus-daemon --system --fork
          dbus-run-session -- cargo test -q --workspace

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --shell=sh install.sh

  installer:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [archlinux:latest, fedora:latest]
    container: ${{ matrix.image }}
    steps:
      - run: if command -v dnf; then dnf install -y dash tar gzip; else pacman -Syu --noconfirm --needed dash; fi
      - uses: actions/checkout@v5
      - name: Install a fake release under dash
        run: |
          set -eu
          m="$RUNNER_TEMP/mirror/clipboard-v9.9.9"
          a=clipboard-x86_64-linux
          mkdir -p "$m" "$RUNNER_TEMP/pkg/$a"
          printf '#!/bin/sh\necho fake\n' > "$RUNNER_TEMP/pkg/$a/clipboard"
          tar -C "$RUNNER_TEMP/pkg" -czf "$m/$a.tar.gz" "$a"
          (cd "$m" && sha256sum "$a.tar.gz" > "$a.tar.gz.sha256")
          bin="$RUNNER_TEMP/bin"
          FERRITE_MIRROR="$RUNNER_TEMP/mirror" dash install.sh --version 9.9.9 --dir "$bin" clipboard
          test "$("$bin/clipboard")" = fake
          dash install.sh --dir "$bin" --uninstall clipboard
          test ! -e "$bin/clipboard"
          # Default dir, PATH without it: new bash shells find the tool; a re-run adds no 2nd line.
          h="$RUNNER_TEMP/home"; mkdir -p "$h"
          for i in 1 2; do
            env -i HOME="$h" PATH=/usr/bin FERRITE_MIRROR="$RUNNER_TEMP/mirror" dash install.sh --version 9.9.9 clipboard
          done
          test "$(grep -c 'ferrite installer' "$h/.bashrc")" = 1
          test "$(env -i HOME="$h" PATH=/usr/bin bash -ic clipboard 2>/dev/null)" = fake
          # A broken checksum must stop the install.
          echo "0  $a.tar.gz" > "$m/$a.tar.gz.sha256"
          if FERRITE_MIRROR="$RUNNER_TEMP/mirror" dash install.sh --version 9.9.9 --dir "$bin" clipboard; then
            echo "installed despite a bad checksum" >&2; exit 1
          fi
          test ! -e "$bin/clipboard"
          dash install.sh --help > /dev/null
          if dash install.sh nope 2>/dev/null; then echo "unknown tool accepted" >&2; exit 1; fi
