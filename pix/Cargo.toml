[package]
name = "pix"
version = "0.1.0"
edition = "2024"

[dependencies]
# PNG decoding: codec, not worth writing ourselves; zune shares zune-core with jpeg.
zune-png = { version = "0.5.2", default-features = false, features = ["std", "sse"] }
# JPEG decoding: SIMD codec, same family (adds 1 crate).
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std", "x86"] }
# ZCursor: the byte reader both decoders take (already in the tree via both).
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
# GIF decoding (LZW + frames): codec, pure Rust = safe on downloaded files; 2 crates (+weezl).
gif = { version = "0.13.3", default-features = false, features = ["std"] }
# WebP and SVG come from system libwebp + librsvg through our own bindings (src/sys/).

[lints.clippy]
too_many_lines = "warn"   # pedantic lint, off unless enabled; limit in clippy.toml

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
